# StudyPi icons. Sources live in assets/brand; re-render them with
# tool/render_brand_icons.sh, then run `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: ic_launcher
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/studypi_icon.png
  image_path_ios_dark_transparent: assets/brand/studypi_icon_dark_transparent.png
  adaptive_icon_background: assets/brand/studypi_adaptive_background.png
  adaptive_icon_foreground: assets/brand/studypi_adaptive_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/brand/studypi_adaptive_monochrome.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/brand/studypi_icon.png
    background_color: "#0E4E5A"
    theme_color: "#0E4E5A"
  windows:
    generate: true
    image_path: assets/brand/studypi_icon_rounded.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/brand/studypi_icon_rounded.png
